<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Signed in via hamnir — the identity claims from the verified ID token and the userinfo endpoint.">
  <title>Signed in — Example Application</title>
  <style>
    :root {
      --ground: #fbfaf7;
      --surface: #ffffff;
      --ink: #1c1b1a;
      --muted: #6f6b64;
      --border: #ece9e2;
      --accent: #0f9d8f;
      --accent-strong: #0c8579;
      --code-bg: #f6f4ef;
      --shadow: 0 1px 2px rgba(28, 27, 26, .05), 0 12px 32px -12px rgba(28, 27, 26, .18);
      --font-display: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
      --font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #17191a;
        --surface: #1f2223;
        --ink: #f2efe8;
        --muted: #9a968d;
        --border: #2c2f30;
        --accent: #2dd4bf;
        --accent-strong: #5fe6d4;
        --code-bg: #14201f;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 16px 40px -16px rgba(0, 0, 0, .6);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--ground);
      color: var(--ink);
      font-family: var(--font-body);
    }

    .wrap {
      max-width: 44rem;
      margin: 0 auto;
      padding: 3rem 1.25rem 3.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .3rem .7rem;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      color: var(--accent-strong);
      border-radius: 999px;
      font-size: .78rem;
      font-weight: 600;
    }

    .wrap h2 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: -.015em;
      margin: .8rem 0 .3rem;
    }

    .who {
      color: var(--muted);
      margin: 0 0 2rem;
      font-size: 1.02rem;
    }

    .who strong {
      color: var(--ink);
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem 1.2rem;
      margin-bottom: 1.1rem;
      box-shadow: var(--shadow);
    }

    .panel-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: .7rem;
    }

    .panel-head h3 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.02rem;
      margin: 0;
    }

    .panel-head span {
      font-size: .82rem;
      color: var(--muted);
    }

    pre {
      margin: 0;
      background: var(--code-bg);
      border-radius: 10px;
      padding: .9rem 1rem;
      overflow-x: auto;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: .84rem;
      line-height: 1.5;
      color: var(--ink);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: .2rem;
    }

    .again {
      color: var(--accent-strong);
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

    .again:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <div class="topbar">
      <span class="badge">&#10003; Signed in</span>
      <a class="again" href="/login">Log in again &rarr;</a>
    </div>
    <h2>You&rsquo;re signed in</h2>
    <p class="who">You are <strong>{{if .Name}}{{.Name}}{{else}}{{.Subject}}{{end}}</strong>{{if .Email}}
      &lt;{{.Email}}&gt;{{end}}.</p>
    <div class="panel">
      <div class="panel-head">
        <h3>ID token claims</h3>
        <span>Verified locally against hamnir's JWKS</span>
      </div>
      <pre>{{.IDTokenClaims}}</pre>
    </div>
    <div class="panel">
      <div class="panel-head">
        <h3>Userinfo claims</h3>
        <span>Fetched server-to-server with the access token</span>
      </div>
      <pre>{{.UserinfoClaims}}</pre>
    </div>
  </main>
</body>

</html>
