<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="A tiny demo relying party that signs you in with hamnir and shows the OpenID Connect identity claims it receives.">
  <title>Example Application</title>
  <style>
    :root {
      --ground: #fbfaf7;
      --ink: #1c1b1a;
      --muted: #6f6b64;
      --accent: #0f9d8f;
      --accent-strong: #0c8579;
      --accent-ink: #ffffff;
      --shadow: 0 1px 2px rgba(28, 27, 26, .05), 0 12px 32px -12px rgba(28, 27, 26, .18);
      --font-display: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
      --font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #17191a;
        --ink: #f2efe8;
        --muted: #9a968d;
        --accent: #2dd4bf;
        --accent-strong: #5fe6d4;
        --accent-ink: #0c2b27;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 16px 40px -16px rgba(0, 0, 0, .6);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--ground);
      color: var(--ink);
      font-family: var(--font-body);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1.1rem;
    }

    .hero h1 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(2rem, 5vw, 2.9rem);
      letter-spacing: -.02em;
      margin: 0;
      text-wrap: balance;
    }

    .hero p {
      max-width: 34rem;
      margin: 0;
      color: var(--muted);
      font-size: 1.06rem;
      line-height: 1.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin-top: .6rem;
      padding: .8rem 1.4rem;
      background: var(--accent);
      color: var(--accent-ink);
      border-radius: 12px;
      text-decoration: none;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.02rem;
      box-shadow: var(--shadow);
      transition: transform .12s ease, background .12s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: var(--accent-strong);
    }

    .btn:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .foot {
      margin-top: 1.5rem;
      font-size: .82rem;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .btn {
        transition: none;
      }

      .btn:hover {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <main class="hero">
    <h1>Example Application</h1>
    <p>A tiny demo app that signs you in with hamnir, then shows the identity claims
      it receives — from the verified ID token and the userinfo endpoint.</p>
    <a class="btn" href="/login">Log in with hamnir &rarr;</a>
    <div class="foot">Dev-only relying party · powered by hamnir</div>
  </main>
</body>

</html>
