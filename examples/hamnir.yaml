# yaml-language-server: $schema=https://raw.githubusercontent.com/strangemattersystems/hamnir/main/api/hamnir.schema.json

# Sample hamnir config for the Docker Compose example. A richer set of personas
# than the `hamnir init` starter: two groups with custom claims per persona, plus
# static content, a registered client, and an audience.

# issuer is how other services reach hamnir on the Compose network — the webapp
# discovers it here, and it's the `iss` stamped into issued tokens.
issuer: http://hamnir:5556

# browser_url is where the user's browser gets sent (a published port it can
# actually reach). hamnir advertises its browser-facing endpoints (/authorize,
# end_session) here; discovery, token and JWKS stay on the issuer URL above.
browser_url: http://localhost:5556

# static configures serving some static content from hamnir. Here we use it to
# serve the contents of the avatars directory which are some example avatar images
# we'll expose as the "picture" claim in the personas.
static:
  # This is the default prefix but we show it here for clarity. Claims that start
  # with this prefix are rewritten to an absolute URL under browser_url at startup.
  prefix: hamnir://
  paths:
    # This exposes the avatars dir. We recommend mapping it to somewhere under
    # /etc/hamnir.
    avatars: /etc/hamnir/avatars

# aud claim for access tokens (and, with the client id appended, id tokens).
# Set this to your API's identifier if your middleware validates audience.
audiences: [https://api.example.test]

# Registering the web app as a client puts hamnir in strict mode: only these exact
# redirect URIs are accepted. Delete this block to run in permissive dev mode
# (any client_id and redirect_uri). The app has no secret, so it is a public
# client and authenticates with PKCE.
clients:
  - id: example-webapp
    redirect_uris:
      # Note that this matches where the webapp is actually exposed via our
      # docker-compose.yml file.
      - http://localhost:8080/callback

# Groups are used to categorize personas. We use two groups here for the sake of
# the example, but you can have as many as you like.
groups:
  - id: team
    label: Team
    colour: "#2563eb"
  - id: customers
    label: Customers
    colour: "#16a34a"

# Personas are the users of your application. You can configure as many as you like,
# with various names, descriptions, groups, and any claims you want to expose.
personas:
  - name: Marcus
    description: Backend engineer
    group: team
    claims:
      sub: usr_marcus
      email: marcus@example.test
      email_verified: true
      name: Marcus Reed
      department: Engineering
      picture: hamnir://avatars/marcus.svg
    tokens:
      - tkn-marcus
  - name: Priya
    description: Product designer
    group: team
    claims:
      sub: usr_priya
      email: priya@example.test
      email_verified: true
      name: Priya Anand
      department: Design
      picture: hamnir://avatars/priya.svg
    tokens:
      - tkn-priya
  - name: Theo
    description: Support lead
    group: team
    claims:
      sub: usr_theo
      email: theo@example.test
      email_verified: true
      name: Theo Novak
      department: Support
      picture: hamnir://avatars/theo.svg
    tokens:
      - tkn-theo
  - name: Elena
    description: Engineering manager
    group: team
    claims:
      sub: usr_elena
      email: elena@example.test
      email_verified: true
      name: Elena Marsh
      department: Engineering
      picture: hamnir://avatars/elena.svg
    tokens:
      - tkn-elena
  - name: Robin
    description: New signup
    group: customers
    claims:
      sub: usr_robin
      email: robin@example.test
      email_verified: true
      name: Robin Cole
      plan: free
      picture: hamnir://avatars/robin.svg
    tokens:
      - tkn-robin
  - name: Ivy
    description: Power user
    group: customers
    claims:
      sub: usr_ivy
      email: ivy@example.test
      email_verified: true
      name: Ivy Tran
      plan: pro
      picture: hamnir://avatars/ivy.svg
    tokens:
      - tkn-ivy
  - name: Maya
    description: Trial user
    group: customers
    claims:
      sub: usr_maya
      email: maya@example.test
      email_verified: true
      name: Maya Okoye
      plan: trial
      picture: hamnir://avatars/maya.svg
    tokens:
      - tkn-maya
  - name: George
    description: Org administrator
    group: customers
    claims:
      sub: usr_george
      email: george@example.test
      email_verified: true
      name: George Ellis
      plan: enterprise
      picture: hamnir://avatars/george.svg
    tokens:
      - tkn-george

# The provider's token signing key (base64 PKCS#8), generated by `hamnir init`.
# hamnir is a development-only provider: this key protects nothing real and is
# safe to check in to version control.
signing_key: 
