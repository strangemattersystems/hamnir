# yaml-language-server: $schema=https://raw.githubusercontent.com/strangemattersystems/hamnir/main/api/hamnir.schema.json

# Sample hamnir config for the Docker Compose example. The personas mirror the
# `hamnir init` starter config.
#
# There is deliberately no `issuer:` set — hamnir derives the issuer from each
# request's host. That is what lets the browser (http://localhost:5556) and the
# webapp container (http://hamnir:5556) each receive an issuer they can reach.
# See the README for the details.

# Registering the web app as a client puts hamnir in strict mode: only these exact
# redirect URIs are accepted. Delete this block to run in permissive dev mode
# (any client_id and redirect_uri). The app has no secret, so it is a public
# client and authenticates with PKCE.
clients:
  - id: example-webapp
    redirect_uris:
      - http://localhost:8080/callback

groups:
  - id: parents
    label: Parents
    colour: "#2563eb"
  - id: children
    label: Children
    colour: "#16a34a"

personas:
  - name: Homer
    description: Nuclear safety inspector
    group: parents
    claims:
      sub: usr_homer
      email: homer@example.test
      email_verified: true
      name: Homer Simpson
      catchphrase: "D'oh!"
  - name: Marge
    description: Homemaker
    group: parents
    claims:
      sub: usr_marge
      email: marge@example.test
      email_verified: true
      name: Marge Simpson
      catchphrase: "Hrmm"
  - name: Bart
    description: Fourth grader
    group: children
    claims:
      sub: usr_bart
      email: bart@example.test
      email_verified: true
      name: Bart Simpson
  - name: Lisa
    description: Second grader
    group: children
    claims:
      sub: usr_lisa
      email: lisa@example.test
      email_verified: true
      name: Lisa Simpson
  - name: Maggie
    description: Baby of the family
    group: children
    claims:
      sub: usr_maggie
      email: maggie@example.test
      email_verified: true
      name: Maggie Simpson
