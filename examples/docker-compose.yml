services:
  hamnir:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["serve", "--addr", "0.0.0.0:5556", "--config", "/etc/hamnir/hamnir.yaml"]
    volumes:
      - ./hamnir.yaml:/etc/hamnir/hamnir.yaml:ro
    ports:
      - "5556:5556"

  webapp:
    build:
      context: ./webapp
    environment:
      # Reached over the Compose network (server-to-server): discovery, token, JWKS.
      HAMNIR_INTERNAL_URL: http://hamnir:5556
      # Where the browser is redirected (a published host port).
      HAMNIR_PUBLIC_URL: http://localhost:5556
      CLIENT_ID: example-webapp
      REDIRECT_URI: http://localhost:8080/callback
      ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      - hamnir
