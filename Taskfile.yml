# https://taskfile.dev
version: "3"

vars:
  BINARY: hamnir
  GORELEASER: go run github.com/goreleaser/goreleaser/v2@v2.17.0

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the hamnir binary
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev
      REVISION:
        sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
      DATE:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
      LDFLAGS: >-
        -X main.version={{.VERSION}}
        -X main.revision={{.REVISION}}
        -X main.date={{.DATE}}
    cmds:
      - go build -ldflags '{{.LDFLAGS}}' -o {{.BINARY}} ./cmd/hamnir

  exec:
    desc: Build and run the hamnir binary (e.g. task exec -- serve --config examples/hamnir.yaml)
    cmds:
      - task: build
      - ./{{.BINARY}} {{.CLI_ARGS}}

  test:
    desc: Run the test suite with the race detector and coverage
    cmds:
      - go test -race -cover ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - go tool golangci-lint run ./...

  fmt:
    desc: Format the code
    cmds:
      - go tool golangci-lint fmt ./...

  ci:
    desc: Run the full CI suite
    cmds:
      - task: build
      - cmd: |
          rc=0
          task test || rc=1
          task lint || rc=1
          exit $rc

  release-check:
    desc: Validate the goreleaser config
    cmds:
      - "{{.GORELEASER}} check"

  release-snapshot:
    desc: Build a local snapshot release into dist/ (no tag, no publish)
    cmds:
      - "{{.GORELEASER}} release --snapshot --clean"

  warm-proxy:
    desc: Wait for proxy.golang.org to report the release tag
    silent: true
    cmds:
      - cmd: |
          set -eu
          module="$(go list -m)"
          tag="${GORELEASER_CURRENT_TAG:-$(git describe --tags --exact-match 2>/dev/null || true)}"
          if [ -z "$tag" ]; then
            echo "warm-proxy: not a tagged commit - skipping"
            exit 0
          fi
          echo "warm-proxy: waiting for proxy.golang.org to report $module@$tag"
          i=1
          while [ "$i" -le 8 ]; do
            curl -sS -o /dev/null "https://proxy.golang.org/$module/@latest" || true
            if curl -sS "https://proxy.golang.org/$module/@v/list" 2>/dev/null | grep -qx "$tag"; then
              echo "warm-proxy: proxy reports $tag (attempt $i)"
              exit 0
            fi
            echo "warm-proxy: attempt $i/8 - $tag not in @v/list yet"
            if [ "$i" -lt 8 ]; then sleep 4; fi
            i=$((i + 1))
          done
          echo "warm-proxy: proxy.golang.org did not report $tag after 8 attempts (~28s)" >&2
          exit 1

  release:
    desc: Build and publish a release (should run on a pushed tag in CI only)
    deps: [warm-proxy]
    cmds:
      - "{{.GORELEASER}} release --clean"
