# yaml-language-server: $schema=https://raw.githubusercontent.com/strangemattersystems/hamnir/main/api/hamnir.schema.json

# This is a minimal starter config for you to adapt as you need. 
# The hamnir repo (https://github.com/strangemattersystems/hamnir) has more complete
# examples and documentation showing how you can configure features like groups,
# static content, and client restrictions.

personas:
  - name: Alice
    description: Sender
    claims:
      sub: usr_alice
      email: alice@example.test
      email_verified: true
      name: Alice
  - name: Bob
    description: Recipient
    claims:
      sub: usr_bob
      email: bob@example.test
      email_verified: true
      name: Bob
  - name: Eve
    description: Eavesdropper
    claims:
      sub: usr_eve
      email: eve@example.test
      email_verified: true
      name: Eve
      evesdropper: true

# hamnir is a development-only provider: this key protects nothing real and is
# meant to be committed with this file.
signing_key: REPLACED-BY-HAMNIR-INIT
